<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Плакаты — APAFENOZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --ink:    #111;
      --muted:  #888;
      --line:   #e4e4e4;
      --bg:     #f4f4f4;
      --mono: 'IBM Plex Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--mono);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      cursor: none;
      overflow-x: hidden;
    }
    a { cursor: none; }

    /* ══════ КАСТОМНЫЙ КУРСОР (чёрный) ══════ */
    .cursor-dot, .cursor-ring {
      position: fixed; top: 0; left: 0; border-radius: 50%;
      pointer-events: none; z-index: 10001; transform: translate(-50%, -50%);
    }
    .cursor-dot  { width: 6px; height: 6px; background: #111; }
    .cursor-ring {
      width: 24px; height: 24px; border: 2px solid #111; opacity: 0.6;
      transition: width .25s, height .25s, opacity .25s;
    }
    .cursor-ring.hover { width: 34px; height: 34px; opacity: 1; }
    @media (hover: none) {
      body, a { cursor: auto; }
      .cursor-dot, .cursor-ring { display: none; }
    }

    /* ══════ ПРЕЛОАДЕР: CANVAS РАСТЕКАНИЕ ТУШИ ══════ */
    .preloader {
      position: fixed; inset: 0; z-index: 10000;
      background: #f4f4f4;
      display: flex; align-items: center; justify-content: center;
    }
    #splashCanvas {
      display: block; width: 100vw; height: 100vh;
    }
    .preloader.done {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    /* ══════ ШАПКА ══════ */
    .hd {
      position: sticky; top: 0; z-index: 100;
      background: rgba(244,244,244,0.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 0 clamp(20px,5vw,60px); height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hd-back {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink); text-decoration: none; transition: gap .2s;
    }
    .hd-back::before { content: '←'; font-size: 16px; }
    .hd-back:hover { gap: 16px; }
    .hd-meta { font-size: 11px; font-style: italic; color: var(--muted); }

    /* ══════ HERO ══════ */
    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 clamp(20px,5vw,60px); }
    .hero { padding: clamp(50px,8vw,90px) 0 clamp(30px,4vw,50px); }
    .hero-sub { font-size: 12px; letter-spacing: 0.2em; text-transform: lowercase; color: var(--muted); margin-bottom: 10px; }
    .hero-title {
      font-size: clamp(40px,9vw,120px); font-weight: 700; line-height: 0.9;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .hero-count { margin-top: 20px; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }

    /* ══════ ХАОТИЧНАЯ СЕТКА (masonry-стиль) ══════ */
    .grid {
      columns: 5;
      column-gap: 24px;
      padding: 30px 0 90px;
    }
    .poster {
      break-inside: avoid;
      margin-bottom: 24px;
      background: #ddd; overflow: hidden;
      cursor: none; position: relative;
      transition: transform .3s ease, box-shadow .3s ease;
      opacity: 0; transform: translateY(20px);
    }
    .poster.in { opacity: 1; transform: translateY(0); transition: opacity .6s ease, transform .6s ease; }
    .poster img { width: 100%; height: auto; display: block; }
    .poster.ph {
      display: flex; align-items: center; justify-content: center;
      background: #e8e8e8; border: 1px dashed #bbb;
    }
    .poster.ph::before {
      content: attr(data-n);
      font-size: 13px; color: #aaa; letter-spacing: 0.1em;
    }
    .poster:hover { transform: translateY(-6px); box-shadow: 0 14px 34px rgba(0,0,0,0.18); }

    @media (max-width: 1200px) { .grid { columns: 4; } }
    @media (max-width: 900px)  { .grid { columns: 3; } }
    @media (max-width: 640px)  { .grid { columns: 2; column-gap: 14px; } .poster { margin-bottom: 14px; } }

    /* ══════ МОДАЛКА (детали плаката) ══════ */
    .modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,0.82);
      display: flex; align-items: center; justify-content: center;
      padding: clamp(20px,5vw,60px);
      opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s ease;
    }
    .modal.open { opacity: 1; visibility: visible; }
    .modal-inner {
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px;
      max-width: 1100px; width: 100%; max-height: 88vh;
      background: #fff; padding: 32px;
      transform: scale(0.96); transition: transform .35s ease;
      overflow: auto;
    }
    .modal.open .modal-inner { transform: scale(1); }
    .modal-visual { display: flex; flex-direction: column; gap: 14px; }
    .modal-main { width: 100%; aspect-ratio: 3/4; background: #eee; overflow: hidden; }
    .modal-main img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .modal-main.ph { display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 13px; border: 1px dashed #ccc; }
    .modal-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .modal-detail { aspect-ratio: 1/1; background: #eee; overflow: hidden; }
    .modal-detail img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .modal-detail.ph { display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 10px; border: 1px dashed #ddd; }
    .modal-text { display: flex; flex-direction: column; }
    .modal-tag { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .modal-title { font-size: clamp(24px,3vw,38px); font-weight: 700; line-height: 1; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 8px; }
    .modal-year { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .modal-desc { font-size: 14px; letter-spacing: -0.02em; line-height: 1.7; color: #333; }
    .modal-close {
      position: absolute; top: 24px; right: 24px;
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid #fff; background: transparent; color: #fff;
      font-size: 20px; cursor: none;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    .modal-close:hover { background: #fff; color: #111; }

    @media (max-width: 800px) {
      .modal-inner { grid-template-columns: 1fr; gap: 24px; }
    }

    /* ══════ ФУТЕР ══════ */
    .ft { padding: 40px clamp(20px,5vw,60px); border-top: 1px solid var(--line); text-align: center; }
    .ft-s { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <!-- КУРСОР -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- ПРЕЛОАДЕР: CANVAS РАСТЕКАНИЕ ТУШИ -->
  <div class="preloader" id="preloader">
    <canvas id="splashCanvas"></canvas>
  </div>

  <!-- ШАПКА -->
  <header class="hd">
    <a href="index.html" class="hd-back">На главную</a>
    <span class="hd-meta">графический дизайн · плакаты</span>
  </header>

  <!-- HERO -->
  <div class="wrap">
    <section class="hero">
      <div class="hero-sub">как самовыражение и творчество</div>
      <h1 class="hero-title">Плакаты</h1>
      <div class="hero-count">36 работ · 2023—2025</div>
    </section>

    <!-- ХАОТИЧНАЯ СЕТКА (36 шт) -->
    <div class="grid" id="grid"><!-- заполнит JS --></div>
  </div>

  <!-- ФУТЕР -->
  <footer class="ft">
    <div class="ft-s">APAFENOZ — портфолио · Safronov Denis</div>
  </footer>

  <!-- МОДАЛКА -->
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-inner">
      <div class="modal-visual">
        <div class="modal-main ph" id="mMain">плакат</div>
        <div class="modal-details" id="mDetails"></div>
      </div>
      <div class="modal-text">
        <div class="modal-tag" id="mTag">плакат</div>
        <h2 class="modal-title" id="mTitle">Название</h2>
        <div class="modal-year" id="mYear">2024</div>
        <p class="modal-desc" id="mDesc"></p>
      </div>
    </div>
  </div>

  <script>
    /* ══════ ПРЕЛОАДЕР: РАСТЕКАНИЕ КАПЛИ ТУШИ (Canvas) ══════ */
    const canvas = document.getElementById('splashCanvas');
    const ctx = canvas.getContext('2d');
    const preloader = document.getElementById('preloader');

    // размер canvas = размер окна
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // частицы туши
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 12;        // случайная горизонталь скорость
        this.vy = (Math.random() - 0.5) * 12;        // случайная вертикальная скорость
        this.r = Math.random() * 8 + 2;              // радиус 2–10px
        this.life = 1;                                // альфа
        this.drag = 0.98;                             // трение
      }

      update() {
        // двигаемся
        this.x += this.vx;
        this.y += this.vy;
        // замедляемся (трение)
        this.vx *= this.drag;
        this.vy *= this.drag;
        // гравитация (слабая, для более натурального падения)
        this.vy += 0.15;
        // исчезаем
        this.life -= 0.015;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const particles = [];
    let animationFrame = 0;
    const animationDuration = 1400; // мс, как долго работает анимация

    function createSplash() {
      // центр экрана
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      // создаём 120–150 частиц, летящих во все стороны
      const count = 120 + Math.random() * 30;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(cx, cy));
      }
    }

    function animate(timestamp) {
      // белый фон (как лист бумаги)
      ctx.fillStyle = '#f4f4f4';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // обновляем и рисуем частицы
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        // удаляем мёртвые частицы
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      animationFrame++;
      const elapsed = animationFrame * (1000 / 60); // примерная прошедшая время

      // если всё ещё анимируем — продолжаем
      if (elapsed < animationDuration || particles.length > 0) {
        requestAnimationFrame(animate);
      } else {
        // анимация окончена
        preloader.classList.add('done');
        // даём время на fade-out (0.6s) и скрываем
        setTimeout(() => preloader.style.display = 'none', 600);
      }
    }

    // создаём первую взрывную волну
    createSplash();
    // вторая волна через 200мс (для эффекта "переброса" туши)
    setTimeout(() => createSplash(), 200);

    // запускаем анимацию
    animate(0);

    /* ══════ ДАННЫЕ ПЛАКАТОВ (36 шт) ══════ */
    const TOTAL = 36;
    const posters = [];
    for (let i = 1; i <= TOTAL; i++) {
      const n = String(i).padStart(2, '0');
      posters.push({
        n: n,
        img: `assets/images/posters/poster-${n}.webp`,
        title: `Плакат ${n}`,
        year: '2024',
        desc: 'Описание плаката. Здесь будет текст о концепции, идее и инструментах. Замени на свой.',
        details: [
          `assets/images/posters/poster-${n}-d1.webp`,
          `assets/images/posters/poster-${n}-d2.webp`,
          `assets/images/posters/poster-${n}-d3.webp`
        ]
      });
    }

    /* ══════ РЕНДЕР СЕТКИ (хаотичные высоты для заглушек) ══════ */
    const grid = document.getElementById('grid');
    const phHeights = [280, 340, 240, 400, 300, 360, 260, 320];
    posters.forEach((p, idx) => {
      const cell = document.createElement('div');
      cell.className = 'poster ph';
      cell.dataset.n = p.n;
      cell.dataset.idx = idx;
      cell.style.height = phHeights[idx % phHeights.length] + 'px';
      const img = new Image();
      img.src = p.img;
      img.alt = p.title;
      img.onload = () => {
        cell.classList.remove('ph');
        cell.style.height = 'auto';
        cell.innerHTML = '';
        cell.appendChild(img);
      };
      grid.appendChild(cell);

      // плавное появление плиток (начинается после прелоадера)
      setTimeout(() => cell.classList.add('in'), 1400 + idx * 35);
    });

    /* ══════ МОДАЛКА ══════ */
    const modal   = document.getElementById('modal');
    const mMain   = document.getElementById('mMain');
    const mDetails= document.getElementById('mDetails');
    const mTag    = document.getElementById('mTag');
    const mTitle  = document.getElementById('mTitle');
    const mYear   = document.getElementById('mYear');
    const mDesc   = document.getElementById('mDesc');

    function openModal(p) {
      mTag.textContent = `плакат · ${p.n}`;
      mTitle.textContent = p.title;
      mYear.textContent = p.year;
      mDesc.textContent = p.desc;

      mMain.className = 'modal-main ph';
      mMain.textContent = 'плакат';
      const big = new Image();
      big.src = p.img;
      big.onload = () => { mMain.className = 'modal-main'; mMain.innerHTML=''; mMain.appendChild(big); };

      mDetails.innerHTML = '';
      p.details.forEach((src, i) => {
        const box = document.createElement('div');
        box.className = 'modal-detail ph';
        box.textContent = 'кадр ' + (i+1);
        const di = new Image();
        di.src = src;
        di.onload = () => { box.className = 'modal-detail'; box.innerHTML=''; box.appendChild(di); };
        mDetails.appendChild(box);
      });

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    grid.addEventListener('click', (e) => {
      const cell = e.target.closest('.poster');
      if (!cell) return;
      openModal(posters[+cell.dataset.idx]);
    });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    /* ══════ КУРСОР ══════ */
    (function () {
      const dot  = document.querySelector('.cursor-dot');
      const ring = document.querySelector('.cursor-ring');
      if (!dot || !ring) return;
      let mx=0,my=0,rx=0,ry=0;
      window.addEventListener('mousemove', e => {
        mx=e.clientX; my=e.clientY;
        dot.style.left=mx+'px'; dot.style.top=my+'px';
      });
      (function anim(){
        rx += (mx-rx)*0.18; ry += (my-ry)*0.18;
        ring.style.left=rx+'px'; ring.style.top=ry+'px';
        requestAnimationFrame(anim);
      })();
      document.addEventListener('mouseover', e => {
        if (e.target.closest('a, button, .poster, .modal-detail, .modal-close'))
          ring.classList.add('hover');
        else ring.classList.remove('hover');
      });
    })();
  </script>
</body>
</html>
